<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Hanser Wei — Backend engineer, open-source builder, curious human.</title>
  <desc id="desc">寒森，成都。用代码构建，用实验求证，用文字记录。Java、Rust、AI Agents 与 Homelab。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#141e25"/><stop offset=".55" stop-color="#11161f"/><stop offset="1" stop-color="#201b31"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#b4f272"/><stop offset=".52" stop-color="#76d9ec"/><stop offset="1" stop-color="#b6a0ff"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#b6a0ff" stop-opacity=".15"/><stop offset="1" stop-color="#b6a0ff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#c9dbf1" stroke-opacity=".04"/></pattern>
    <style>
      .sans{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.cn{font-family:Arial,PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif}
      .orbit{transform-origin:957px 210px;animation:turn 48s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}
      @keyframes turn{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.35}}
      @media(prefers-reduced-motion:reduce){.orbit,.pulse{animation:none}}
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="438" rx="24" fill="url(#bg)" stroke="#303647"/>
  <rect x="1" y="1" width="1198" height="438" rx="24" fill="url(#grid)"/>
  <ellipse cx="950" cy="225" rx="250" ry="213" fill="url(#glow)"/>
  <path d="M28 1H1172" stroke="url(#line)" stroke-width="2"/>
  <circle cx="54" cy="49" r="5" fill="#b4f272" class="pulse"/>
  <text x="71" y="55" fill="#b4f272" class="mono" font-size="17" letter-spacing="2">HANSERWEI / PERSONAL LAB</text>
  <text x="50" y="172" fill="#f2f5ed" class="sans" font-size="92" font-weight="750" letter-spacing="-5">Hanser Wei<tspan fill="#b4f272">.</tspan></text>
  <text x="55" y="223" fill="#bdc5d4" class="sans" font-size="26">Backend engineer. Open-source builder.</text>
  <text x="55" y="271" fill="#e0e6e9" class="cn" font-size="26">用代码构建，用实验求证，用文字记录。</text>
  <g class="mono" font-size="15" fill="#c6cedb">
    <rect x="55" y="309" width="95" height="32" rx="16" fill="#b4f272" fill-opacity=".1" stroke="#b4f272" stroke-opacity=".3"/><text x="76" y="330" fill="#b4f272">JAVA 25</text>
    <rect x="160" y="309" width="76" height="32" rx="16" fill="#ffffff" fill-opacity=".03" stroke="#414555"/><text x="180" y="330">RUST</text>
    <rect x="246" y="309" width="124" height="32" rx="16" fill="#ffffff" fill-opacity=".03" stroke="#414555"/><text x="264" y="330">AI AGENTS</text>
    <rect x="380" y="309" width="106" height="32" rx="16" fill="#ffffff" fill-opacity=".03" stroke="#414555"/><text x="398" y="330">HOMELAB</text>
  </g>
  <g fill="none" stroke="#b6a0ff">
    <circle cx="957" cy="210" r="146" stroke-opacity=".2"/>
    <circle cx="957" cy="210" r="179" stroke-opacity=".12" stroke-dasharray="3 10"/>
    <g class="orbit"><ellipse cx="957" cy="210" rx="179" ry="62" transform="rotate(-35 957 210)" stroke-opacity=".5"/><circle cx="1104" cy="105" r="6" fill="#b6a0ff" stroke="none"/></g>
  </g>
  <g transform="translate(797 113)">
    <rect width="296" height="202" rx="16" fill="#0c121b" stroke="#495165"/>
    <path d="M0 40H296" stroke="#2a3443"/>
    <circle cx="21" cy="21" r="4" fill="#ef969b"/><circle cx="37" cy="21" r="4" fill="#f3bd78"/><circle cx="53" cy="21" r="4" fill="#b4f272"/>
    <text x="199" y="25" fill="#8995ab" class="mono" font-size="12">~/workbench</text>
    <text x="22" y="78" fill="#a7b1c5" class="mono" font-size="17"><tspan fill="#b4f272">❯</tspan> whoami</text>
    <text x="22" y="111" fill="#eef3e9" class="mono" font-size="21" font-weight="700">a curious builder<tspan fill="#b4f272" class="pulse">_</tspan></text>
    <text x="22" y="147" fill="#96a4b8" class="mono" font-size="15">build → measure → learn</text>
    <text x="22" y="176" fill="#b6a0ff" class="mono" font-size="15">// always in progress</text>
  </g>
  <path d="M55 375H1145" stroke="#303747"/>
  <text x="55" y="409" fill="#98a6ba" class="mono" font-size="15" letter-spacing="1">CHENGDU, CN · UTC+8</text>
  <text x="1145" y="409" text-anchor="end" fill="#b4f272" class="mono" font-size="16">likeyy.love ↗</text>
</svg>
