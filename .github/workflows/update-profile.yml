name: Update profile

on:
  schedule:
    # 09:23 Asia/Shanghai. GitHub schedules are best-effort, in UTC.
    - cron: '23 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.profile/config.json'
      - '.profile/README.template.md'
      - 'scripts/**'
      - 'tests/**'
      - 'assets/hero*.svg'
      - '.github/workflows/update-profile.yml'

permissions:
  contents: read

concurrency:
  group: profile-update
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'Hanserwei/Hanserwei' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Test generator
        run: python -m unittest discover -s tests -v

      - name: Refresh blog posts
        run: python scripts/update_profile.py

      - name: Verify generated profile
        run: python scripts/update_profile.py --check

      - name: Commit changed content
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add README.md .profile/cache.json
          if git diff --cached --quiet; then
            echo 'Profile is already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(profile): refresh blog posts'
          # Authenticate only this step through gh's environment-backed helper.
          gh auth setup-git --hostname github.com
          # A concurrent human push causes a safe failure; never force-push.
          git push origin HEAD:main
